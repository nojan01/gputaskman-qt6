name: Linux tests and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            gputaskman-qt6/collector-requirements.txt
            gputaskman-qt6/gui-requirements.txt
      - name: Desktop libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-dejavu-core
      - name: Dependencies
        run: |
          python -m pip install -r gputaskman-qt6/collector-requirements.txt -r gputaskman-qt6/gui-requirements.txt
          python -m pip install -e ./gputaskman-source
      - name: Build isolated collector
        working-directory: gputaskman-qt6
        run: python -m PyInstaller --noconfirm --clean worker.spec
      - name: GUI, identity, fleet and refresh tests
        run: python -m unittest discover -s gputaskman-qt6 -p 'test_*.py' -v
      - name: Demo smoke tests
        run: |
          python gputaskman-qt6/gui.py --demo --demo-gpus 4 --self-test
          python gputaskman-qt6/gui.py --demo --demo-gpus 8 --self-test
          python gputaskman-qt6/gui.py --demo --demo-gpus 16 --self-test
